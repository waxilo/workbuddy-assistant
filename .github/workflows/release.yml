name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# tauri-action 要用 GITHUB_TOKEN 创建 Release / 上传产物，默认 token 是只读的
permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS  runner 当前为 Apple Silicon；如需 Intel/通用包，见 README“跨平台说明”
          - platform: macos-latest
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS universal targets (可选)
        if: matrix.platform == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
        continue-on-error: true

      - name: Install frontend dependencies
        run: npm install

      - name: Build & publish (tauri-action)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 更新签名私钥（在仓库 Secrets 中配置，见 README）
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "WorkBuddy 签到助手 ${{ github.ref_name }}"
          releaseBody: "自动构建的桌面安装包（macOS / Windows）。"
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  # 产物命名统一：Tauri 默认产物名只有架构（aarch64/x64），两平台混在一个 Release 里不好分辨。
  # 这里在架构前插入 macos_ / windows_ 平台标识，并同步修正 latest.json 里的下载 URL
  # （更新签名只覆盖文件内容，改名不影响校验），最后把 draft Release 转正——
  # 应用内「检查更新」走 releases/latest/download/latest.json，draft 状态下取不到。
  normalize-assets:
    needs: [release]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Rename assets (add platform) & publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p assets && cd assets
          gh release download "$TAG" --repo "$REPO" --clobber

          python3 - <<'PY'
          import json, os, subprocess

          tag, repo = os.environ["TAG"], os.environ["REPO"]
          mapping = {}
          for f in sorted(os.listdir(".")):
              if f == "latest.json":
                  continue
              new = f
              if "_aarch64" in f:          # macOS Apple Silicon
                  new = f.replace("_aarch64", "_macos_aarch64")
              elif "_x86_64" in f:         # macOS Intel
                  new = f.replace("_x86_64", "_macos_x86_64")
              elif "_x64" in f:            # Windows x64
                  new = f.replace("_x64", "_windows_x64")
              if new != f:
                  os.rename(f, new)
                  mapping[f] = new

          # latest.json 里的下载 URL 同步改成新文件名
          text = open("latest.json").read()
          for old, new in mapping.items():
              text = text.replace(old, new)
          json.loads(text)  # 改完必须仍是合法 JSON
          open("latest.json", "w").write(text)
          print("renamed:", json.dumps(mapping, indent=2))

          # 删除 Release 上的旧资产（本地已有全量副本，改名后整体重传）
          releases = json.loads(subprocess.check_output(
              ["gh", "api", f"repos/{repo}/releases"]).decode())
          rel = next(r for r in releases if r["tag_name"] == tag)
          for a in rel["assets"]:
              subprocess.run(["gh", "api", "-X", "DELETE",
                              f"repos/{repo}/releases/assets/{a['id']}"], check=True)
          PY

          gh release upload "$TAG" assets/* --repo "$REPO" --clobber
          gh release edit "$TAG" --repo "$REPO" --draft=false --latest
